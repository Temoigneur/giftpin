<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Giftpin</title>
<style>
  :root { color-scheme: light; }
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a1a1a;
  }
  h1 { font-size: 15px; margin: 0 0 10px; }
  p { margin: 0 0 10px; color: #555; }
  label { display:block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=number] {
    width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  button {
    width: 100%; padding: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;
    border-radius: 6px; border: 1.5px solid #1a1a1a; background: #1a1a1a; color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: #1a1a1a; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .status { min-height: 1.2em; font-size: 12px; margin-top: 8px; }
  .status.error { color: #8c1d13; }
  .preview { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
  .preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: #f2f2f2; }
  .preview .title { font-size: 13px; font-weight: 600; }
  .muted { color: #888; font-size: 12px; }
  a.link { color: #1a1a1a; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

  <section id="connectView">
    <h1>Connect your registry</h1>
    <p>Paste the "manage your registry" link you were emailed when you created your registry.</p>
    <label for="manageLink">Manage link</label>
    <input type="text" id="manageLink" placeholder="https://yourstore.myshopify.com/apps/registry/manage?t=...">
    <button id="connectBtn">Connect</button>
    <p class="status" id="connectStatus"></p>
  </section>

  <section id="addView" hidden>
    <h1 id="registryName">Your registry</h1>
    <div class="preview">
      <img id="previewImage" alt="">
      <div>
        <div class="title" id="previewTitle">Reading this page&hellip;</div>
        <div class="muted" id="previewPrice"></div>
      </div>
    </div>
    <label for="qty">Quantity</label>
    <input type="number" id="qty" value="1" min="1" max="99">
    <button id="addBtn" disabled>Add to registry</button>
    <p class="status" id="addStatus"></p>

    <div id="dupPanel" hidden>
      <label for="dupQty" id="dupMessage">Already on this registry.</label>
      <div class="row">
        <input type="number" id="dupQty" min="1" max="99">
        <button id="dupConfirmBtn">Update</button>
      </div>
      <button class="secondary" id="dupCancelBtn">Never mind</button>
    </div>

    <p style="margin-top:16px;"><a class="link" href="#" id="disconnectLink">Use a different registry</a></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
