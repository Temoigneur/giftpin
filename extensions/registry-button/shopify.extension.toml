# A theme app extension, not a script tag.
#
# This is the structural fix for the incumbent's most-complained-about bug:
# merchants repeatedly reported that a theme update removed the registry button
# and required a support ticket to restore. That failure mode is only possible
# with injected script tags. An app block lives in the theme's own section
# schema, so a theme update cannot silently strip it.
